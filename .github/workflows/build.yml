name: Build ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    env:
      OS_NAME: AyLinux
    steps:
      - name: Depoyu cek (Checkout)
        uses: actions/checkout@v4

      - name: Araclari kur
        run: |
          apt-get update
          apt-get install -y live-build debootstrap xorriso squashfs-tools mtools dosfstools isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin ca-certificates plymouth plymouth-themes

      - name: Yapilandirma
        run: |
          mkdir -p iso && cd iso
          lb config \
            --distribution trixie \
            --architectures amd64 \
            --linux-flavours amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --binary-images iso-hybrid \
            --bootloaders "syslinux,grub-efi" \
            --debian-installer none \
            --memtest none \
            --iso-application "$OS_NAME" \
            --iso-publisher "$OS_NAME" \
            --iso-volume "$OS_NAME" \
            --bootappend-live "boot=live components quiet splash plymouth.ignore-serial-consoles locales=tr_TR.UTF-8 keyboard-layouts=tr timezone=Europe/Istanbul"

          mkdir -p config/package-lists config/archives config/hooks/normal

          # Paket listesi
          cat > config/package-lists/aylinux.list.chroot <<'EOF'
          kde-plasma-desktop
          sddm
          plasma-nm
          network-manager
          konsole
          dolphin
          kate
          ark
          firefox-esr
          pipewire-audio
          wireplumber
          vorbis-tools
          sox
          libsox-fmt-all
          flatpak
          plasma-discover-backend-flatpak
          sudo
          locales
          keyboard-configuration
          console-setup
          firmware-linux
          firmware-misc-nonfree
          firmware-realtek
          firmware-iwlwifi
          firmware-amd-graphics
          mesa-vulkan-drivers
          libgl1-mesa-dri
          mesa-utils
          vulkan-tools
          gamemode
          calamares
          calamares-settings-debian
          libreoffice
          papirus-icon-theme
          arc-theme
          fonts-firacode
          chromium
          synaptic
          snapd
          plymouth
          plymouth-themes
          EOF

          # Backports: daha yeni kernel ve Mesa (oyun performansi icin)
          echo "deb http://deb.debian.org/debian trixie-backports main contrib non-free non-free-firmware" > config/archives/backports.list.chroot
          cp config/archives/backports.list.chroot config/archives/backports.list.binary
          cat > config/archives/backports.pref.chroot <<'EOF'
          Package: linux-image-* mesa-* libgl1-mesa-dri libglx-mesa0 libegl-mesa0 libgbm1 libglapi-mesa
          Pin: release a=trixie-backports
          Pin-Priority: 900
          EOF
          cp config/archives/backports.pref.chroot config/archives/backports.pref.binary

          # Steam + 32-bit destek
          cat > config/hooks/normal/0100-gaming.hook.chroot <<'EOF'
          #!/bin/sh
          set -e
          export DEBIAN_FRONTEND=noninteractive
          dpkg --add-architecture i386
          apt-get update
          echo "steam steam/question select I AGREE" | debconf-set-selections
          echo "steam steam/license note " | debconf-set-selections
          apt-get install -y steam-installer mangohud libgl1-mesa-dri:i386 mesa-vulkan-drivers:i386
          EOF

          # Sistem adi (AyLinux)
          cat > config/hooks/normal/0200-brand.hook.chroot <<EOF
          #!/bin/sh
          sed -i --follow-symlinks 's/^PRETTY_NAME=.*/PRETTY_NAME="$OS_NAME"/' /etc/os-release
          sed -i --follow-symlinks 's/^NAME=.*/NAME="$OS_NAME"/' /etc/os-release
          EOF

          # Snap servisini etkinlestir
          cat > config/hooks/normal/0300-snap.hook.chroot <<'EOF'
          #!/bin/sh
          set -e
          systemctl enable snapd.socket || true
          systemctl enable snapd.apparmor || true
          EOF

          # Plymouth: AyLinux Karanlik Mecha-Pars ve Glow Efekti
          cat > config/hooks/normal/0400-plymouth.hook.chroot <<'EOF'
          #!/bin/sh
          set -e
          mkdir -p /usr/share/plymouth/themes/aylinux
          cat > /usr/share/plymouth/themes/aylinux/aylinux.plymouth <<'PLMOUTH_CFG'
          [Plymouth Theme]
          Name=AyLinux Glow
          Description=AyLinux Mecha-Pars Dark Boot
          ModuleName=glow

          [glow]
          NumberOfGlowSteps=24
          PLMOUTH_CFG
          plymouth-set-default-theme -R aylinux || true
          EOF

          # Kapanis Sesi Servisi (Systemd Shutdown)
          cat > config/hooks/normal/0500-shutdown-sound.hook.chroot <<'EOF'
          #!/bin/sh
          set -e
          cat > /etc/systemd/system/aylinux-shutdown-sound.service <<'SVC'
          [Unit]
          Description=AyLinux Kapanis Sesi (Gicirdayan Kapi)
          DefaultDependencies=no
          Before=poweroff.target halt.target reboot.target

          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c "play /usr/share/sounds/aylinux/shutdown-sound.ogg || ogg123 /usr/share/sounds/aylinux/shutdown-sound.ogg || true"

          [Install]
          WantedBy=poweroff.target reboot.target halt.target
          SVC
          systemctl enable aylinux-shutdown-sound.service || true
          EOF

          # Varsayilan tema: Papirus-Dark + Arc-Dark + Giris sesi
          mkdir -p config/includes.chroot/etc/skel/.config/autostart
          mkdir -p config/includes.chroot/usr/share/sounds/aylinux

          cat > config/includes.chroot/etc/skel/.config/kdeglobals <<'EOF'
          [Icons]
          Theme=Papirus-Dark

          [General]
          ColorScheme=ArcDark
          widgetStyle=Breeze
          EOF

          # Giriste sesi oynatan autostart
          cat > config/includes.chroot/etc/skel/.config/autostart/aylinux-login-sound.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=AyLinux Login Sound
          Exec=sh -c "sleep 1 && (play /usr/share/sounds/aylinux/boot-sound.ogg || ogg123 /usr/share/sounds/aylinux/boot-sound.ogg || paplay /usr/share/sounds/aylinux/boot-sound.ogg)"
          Hidden=false
          NoDisplay=true
          X-GNOME-Autostart-enabled=true
          EOF

          # Eger assets altinda sesler varsa kopyala
          if [ -f ../assets/boot-sound.ogg ]; then
            cp ../assets/boot-sound.ogg config/includes.chroot/usr/share/sounds/aylinux/boot-sound.ogg
          fi
          if [ -f ../assets/shutdown-sound.ogg ]; then
            cp ../assets/shutdown-sound.ogg config/includes.chroot/usr/share/sounds/aylinux/shutdown-sound.ogg
          fi

          # Duvar kagitlarini sisteme gom
          mkdir -p config/includes.chroot/usr/share/wallpapers/AyLinux/contents/images
          if [ -d ../assets/wallpapers ]; then
            cp ../assets/wallpapers/* config/includes.chroot/usr/share/wallpapers/AyLinux/contents/images/
          fi

          # KDE Plasma varsayilan arkaplanini ayarla (Ataturk)
          mkdir -p config/includes.chroot/etc/skel/.config
          cat > config/includes.chroot/etc/skel/.config/plasma-org.kde.plasma.desktop-appletsrc <<'WALLPAPER_EOF'
[Containments][1][Wallpaper][org.kde.image][General]
Image=file:///usr/share/wallpapers/AyLinux/contents/images/ataturk.jpg
WALLPAPER_EOF

          chmod +x config/hooks/normal/*

      - name: ISO uret
        run: cd iso && lb build

      - name: ISO yukle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OS_NAME }}-iso
          path: iso/*.iso
