name: Build ISO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    env:
      OS_NAME: AyLinux
    steps:
      - name: Depoyu cek (Checkout)
        uses: actions/checkout@v4

      - name: Araclari kur
        run: |
          apt-get update
          apt-get install -y live-build debootstrap xorriso squashfs-tools mtools dosfstools isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin ca-certificates plymouth plymouth-themes

      - name: Yapilandirma
        run: |
          mkdir -p iso && cd iso
          lb config \
            --distribution trixie \
            --architectures amd64 \
            --linux-flavours amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --binary-images iso-hybrid \
            --bootloaders "syslinux,grub-efi" \
            --debian-installer none \
            --memtest none \
            --iso-application "$OS_NAME" \
            --iso-publisher "$OS_NAME" \
            --iso-volume "$OS_NAME" \
            --bootappend-live "boot=live components quiet splash plymouth.ignore-serial-consoles locales=tr_TR.UTF-8 keyboard-layouts=tr timezone=Europe/Istanbul username=aylinux hostname=aylinux user-fullname=AyLinux"

          mkdir -p config/package-lists config/archives config/hooks/normal

          # Paket listesi (Chromium kaldirildi, safkan Firefox ESR birakildi)
          cat > config/package-lists/aylinux.list.chroot <<'EOF'
          kde-plasma-desktop
          sddm
          plasma-nm
          network-manager
          konsole
          dolphin
          kate
          ark
          firefox-esr
          pipewire-audio
          wireplumber
          vorbis-tools
          sox
          libsox-fmt-all
          flatpak
          plasma-discover-backend-flatpak
          sudo
          locales
          keyboard-configuration
          console-setup
          firmware-linux
          firmware-misc-nonfree
          firmware-realtek
          firmware-iwlwifi
          firmware-amd-graphics
          mesa-vulkan-drivers
          libgl1-mesa-dri
          mesa-utils
          vulkan-tools
          gamemode
          calamares
          calamares-settings-debian
          libreoffice
          papirus-icon-theme
          arc-theme
          fonts-firacode
          synaptic
          snapd
          plymouth
          plymouth-themes
          fastfetch
          curl
          wget
          git
          htop
          EOF

          # Steam + 32-bit destek
          cat > config/hooks/normal/0100-gaming.hook.chroot <<'EOF'
          #!/bin/sh
          set -e
          export DEBIAN_FRONTEND=noninteractive
          dpkg --add-architecture i386
          apt-get update
          echo "steam steam/question select I AGREE" | debconf-set-selections
          echo "steam steam/license note " | debconf-set-selections
          apt-get install -y steam-installer mangohud libgl1-mesa-dri:i386 mesa-vulkan-drivers:i386
          EOF

          # Sistem adi (AyLinux)
          cat > config/hooks/normal/0200-brand.hook.chroot <<EOF
          #!/bin/sh
          sed -i --follow-symlinks 's/^PRETTY_NAME=.*/PRETTY_NAME="$OS_NAME"/' /etc/os-release
          sed -i --follow-symlinks 's/^NAME=.*/NAME="$OS_NAME"/' /etc/os-release
          EOF

          # Snap servisini etkinlestir
          cat > config/hooks/normal/0300-snap.hook.chroot <<'EOF'
          #!/bin/sh
          set -e
          systemctl enable snapd.socket || true
          systemctl enable snapd.apparmor || true
          EOF

          # Plymouth: AyLinux Karanlik Mecha-Pars ve Glow Efekti
          cat > config/hooks/normal/0400-plymouth.hook.chroot <<'EOF'
          #!/bin/sh
          set -e
          mkdir -p /usr/share/plymouth/themes/aylinux
          cat > /usr/share/plymouth/themes/aylinux/aylinux.plymouth <<'PLMOUTH_CFG'
          [Plymouth Theme]
          Name=AyLinux Glow
          Description=AyLinux Mecha-Pars Dark Boot
          ModuleName=glow

          [glow]
          NumberOfGlowSteps=24
          PLMOUTH_CFG
          plymouth-set-default-theme -R aylinux || true
          EOF

          # Kapanis Sesi Servisi (Systemd Shutdown)
          cat > config/hooks/normal/0500-shutdown-sound.hook.chroot <<'EOF'
          #!/bin/sh
          set -e
          cat > /etc/systemd/system/aylinux-shutdown-sound.service <<'SVC'
          [Unit]
          Description=AyLinux Kapanis Sesi (Gicirdayan Kapi)
          DefaultDependencies=no
          Before=poweroff.target halt.target reboot.target

          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c "play /usr/share/sounds/aylinux/shutdown-sound.ogg || ogg123 /usr/share/sounds/aylinux/shutdown-sound.ogg || true"

          [Install]
          WantedBy=poweroff.target reboot.target halt.target
          SVC
          systemctl enable aylinux-shutdown-sound.service || true
          EOF

          # Sudoers ve Polkit: Canli kullaniciya tam sifresiz yetki (Calamares icin kritik)
          mkdir -p config/includes.chroot/etc/sudoers.d
          echo "aylinux ALL=(ALL) NOPASSWD: ALL" > config/includes.chroot/etc/sudoers.d/aylinux
          chmod 0440 config/includes.chroot/etc/sudoers.d/aylinux

          # Resmi AyLinux APT Deposunu sisteme ekle
          mkdir -p config/includes.chroot/etc/apt/sources.list.d
          echo "deb [trusted=yes] https://victors-lords.github.io/aylinux-repo ./" > config/includes.chroot/etc/apt/sources.list.d/aylinux.list

          # SDDM Canli Oturum Icin Otomatik Giris (Wayland & X11 Uyumu)
          mkdir -p config/includes.chroot/etc/sddm.conf.d
          cat > config/includes.chroot/etc/sddm.conf.d/autologin.conf <<'EOF'
          [Autologin]
          User=aylinux
          Session=plasmawayland
          Relogin=false
          EOF

          # Oturum Fallback Hook: Wayland desktop dosyasi adina gore SDDM oturumunu saglamlastir
          cat > config/hooks/normal/0600-sddm-session.hook.chroot <<'EOF'
          #!/bin/sh
          set -e
          if [ ! -f /usr/share/wayland-sessions/plasmawayland.desktop ] && [ -f /usr/share/wayland-sessions/plasma.desktop ]; then
            sed -i 's/Session=plasmawayland/Session=plasma/' /etc/sddm.conf.d/autologin.conf
          elif [ ! -d /usr/share/wayland-sessions ]; then
            sed -i 's/Session=plasmawayland/Session=plasma/' /etc/sddm.conf.d/autologin.conf
          fi
          EOF

          # Varsayilan tema: Papirus-Dark + Arc-Dark + Giris sesi
          mkdir -p config/includes.chroot/etc/skel/.config/autostart
          mkdir -p config/includes.chroot/usr/share/sounds/aylinux

          cat > config/includes.chroot/etc/skel/.config/kdeglobals <<'EOF'
          [Icons]
          Theme=Papirus-Dark

          [General]
          ColorScheme=ArcDark
          widgetStyle=Breeze
          EOF

          # Masaustu Kısayollari: Calamares Yukleyici
          mkdir -p config/includes.chroot/etc/skel/Desktop
          cat > config/includes.chroot/etc/skel/Desktop/calamares.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Version=1.0
          Name=AyLinux Kur (Install AyLinux)
          GenericName=Sistem Kurucu
          Comment=AyLinux isletim sistemini kalici olarak diske kurun
          Exec=sudo -E calamares
          Icon=calamares
          Terminal=false
          Categories=System;
          StartupNotify=true
          EOF
          chmod +x config/includes.chroot/etc/skel/Desktop/calamares.desktop

          # Giriste sesi oynatan autostart
          cat > config/includes.chroot/etc/skel/.config/autostart/aylinux-login-sound.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=AyLinux Login Sound
          Exec=sh -c "sleep 1 && (play /usr/share/sounds/aylinux/boot-sound.ogg || ogg123 /usr/share/sounds/aylinux/boot-sound.ogg || paplay /usr/share/sounds/aylinux/boot-sound.ogg)"
          Hidden=false
          NoDisplay=true
          X-GNOME-Autostart-enabled=true
          EOF

          # Eger assets altinda sesler varsa kopyala (.github/assets veya assets)
          ASSET_DIR=""
          if [ -d "../.github/assets" ]; then
            ASSET_DIR="../.github/assets"
          elif [ -d "../assets" ]; then
            ASSET_DIR="../assets"
          fi

          if [ -n "$ASSET_DIR" ]; then
            [ -f "$ASSET_DIR/boot-sound.ogg" ] && cp "$ASSET_DIR/boot-sound.ogg" config/includes.chroot/usr/share/sounds/aylinux/boot-sound.ogg || true
            [ -f "$ASSET_DIR/shutdown-sound.ogg" ] && cp "$ASSET_DIR/shutdown-sound.ogg" config/includes.chroot/usr/share/sounds/aylinux/shutdown-sound.ogg || true
            mkdir -p config/includes.chroot/usr/share/wallpapers/AyLinux/contents/images
            [ -d "$ASSET_DIR/wallpapers" ] && cp -r "$ASSET_DIR/wallpapers/"* config/includes.chroot/usr/share/wallpapers/AyLinux/contents/images/ || true
          fi

          # KDE Plasma varsayilan arkaplanini ayarla (Ataturk)
          mkdir -p config/includes.chroot/etc/skel/.config
          echo "[Containments][1][Wallpaper][org.kde.image][General]" > config/includes.chroot/etc/skel/.config/plasma-org.kde.plasma.desktop-appletsrc
          echo "Image=file:///usr/share/wallpapers/AyLinux/contents/images/ataturk.jpg" >> config/includes.chroot/etc/skel/.config/plasma-org.kde.plasma.desktop-appletsrc

          chmod +x config/hooks/normal/*

      - name: ISO uret
        id: build-iso
        run: cd iso && lb build

      - name: ISO yukle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OS_NAME }}-iso
          path: iso/*.iso

      - name: GitHub Release Olustur ve ISO Yukle
        uses: softprops/action-gh-release@v2
        if: always() && steps.build-iso.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.1
          name: AyLinux v1.1 Canli Masaustu Surumu (Official)
          draft: false
          prerelease: false
          generate_release_notes: false
          make_latest: true
          body: |
            # 🇹🇷 AyLinux v1.1 (Resmi Canli Masaustu Surumu)
            
            Tony Stark zihniyetiyle tabletten derlenen canavar gibi milli Linux dagitimi!
            
            ### ✨ Temel Ozellikler:
            - **Masaustu Ortami:** KDE Plasma 6 + Arc-Dark / Papirus-Dark Temasi
            - **Duvar Kagidi:** Varsayilan Ataturk Masaustu Gorseli
            - **Tarayici:** Kararli ve Guvenli Firefox ESR
            - **Ozel Sesler:** Giris & Cikis Ozel AyLinux Ses Efektleri
            - **Gaming Altyapisi:** Steam, MangoHud, Vulkan Suruculeri, GameMode, 32-bit Kutuphaneler
            - **Canli Oturum:** SDDM Parolasiz Otomatik Giris (Kullanici: `aylinux`, Sifresiz Sudo)
            - **Sistem Kurulumu:** Calamares Grafiksel Arayuzlu Yukleyici Masaustunde Hazir
            - **Dahili Paket Deposu:** AyLinux Resmi APT Deposu (`sudo apt install aytop`)
          files: iso/*.iso
